name: Site regression

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: site-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs/site
            scripts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy umap-learn hdbscan

      - name: Verify data contracts
        run: |
          scripts/verify_site_contract.sh docs/site/data/icml2026_index.json
          python3 scripts/verify_abstract_quality.py
          python3 scripts/verify_embedding_map.py docs/site/data/icml2026_index.json docs/site/data/icml2026_map.json
          python3 scripts/test_embedding_map_units.py

      - name: Verify people analysis contracts
        run: |
          node --test \
            scripts/test_data_loader.mjs \
            scripts/test_people_topics_artifact.mjs \
            scripts/test_people_concepts.mjs \
            scripts/test_people_analytics.mjs
          node --check scripts/verify_ui_smoke.mjs
