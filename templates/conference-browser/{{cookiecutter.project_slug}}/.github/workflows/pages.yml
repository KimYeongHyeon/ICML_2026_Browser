name: Build and deploy conference browser

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conference-browser-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild static artifact from committed snapshot
        run: python scripts/build_site.py
      - name: Run contract tests
        run: python -m unittest discover -s tests -v
      - name: Require committed artifact to be current
        run: |
          git diff --exit-code -- docs/data
          if [ -n "$(git status --porcelain --untracked-files=all -- docs/data)" ]; then
            git status --short -- docs/data
            exit 1
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages artifact
        uses: actions/deploy-pages@v4
